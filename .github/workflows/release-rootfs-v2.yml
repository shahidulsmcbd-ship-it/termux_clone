name: Build and Release Rootfs v2

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-rootfs:
    name: Build rootfs packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Download script
        run: |
          curl -sL https://raw.githubusercontent.com/shahidulsmcbd-ship-it/termux_clone/main/scripts/create-rootfs-docker.sh -o create-rootfs-docker.sh
          chmod +x create-rootfs-docker.sh

      - name: Build rootfs for ${{ matrix.arch }}
        run: |
          ls -la
          bash create-rootfs-docker.sh ${{ matrix.arch }} debian-bullseye rootfs-${{ matrix.arch }}.tar.gz

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.arch }}
          path: rootfs-${{ matrix.arch }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build-rootfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all rootfs artifacts
        uses: actions/download-artifact@v4
        with:
          path: rootfs

      - name: List downloaded files
        run: ls -la rootfs/

      - name: Setup GitHub CLI
        run: |
          export GH_TOKEN=${{ github.token }}
          echo "$GH_TOKEN" | gh auth login --with-token
          gh auth status

      - name: Debug token and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Token starts with: ${GH_TOKEN:0:10}"
          gh auth status
          gh release create ${{ github.event.inputs.version }} \
            --title "Rootfs Release ${{ github.event.inputs.version }}" \
            --notes "Pre-built rootfs packages for Termux Clone" \
            rootfs/rootfs-arm64/rootfs-arm64.tar.gz \
            rootfs/rootfs-x86_64/rootfs-x86_64.tar.gz
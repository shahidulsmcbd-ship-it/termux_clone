name: Build and Release Rootfs v2

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-rootfs:
    name: Build rootfs packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Download script
        run: |
          curl -sL https://raw.githubusercontent.com/shahidulsmcbd-ship-it/termux_clone/main/scripts/create-rootfs-docker.sh -o create-rootfs-docker.sh
          chmod +x create-rootfs-docker.sh

      - name: Build rootfs for ${{ matrix.arch }}
        run: |
          ls -la
          bash create-rootfs-docker.sh ${{ matrix.arch }} debian-bullseye rootfs-${{ matrix.arch }}.tar.gz

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.arch }}
          path: rootfs-${{ matrix.arch }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build-rootfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all rootfs artifacts
        uses: actions/download-artifact@v4
        with:
          path: rootfs

      - name: List downloaded files
        run: ls -la rootfs/

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          REPO="${{ github.repository }}"
          
          # Create release
          RELEASE_JSON=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"tag_name":"'"$VERSION"'" ,"name":"Rootfs Release '"$VERSION"'","body":"Pre-built rootfs packages for Termux Clone"}' \
            "https://api.github.com/repos/$REPO/releases")
          
          echo "Release response: $RELEASE_JSON"
          
          UPLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.upload_url' 2>/dev/null)
          echo "Upload URL: $UPLOAD_URL"
          
          if [ "$UPLOAD_URL" != "null" ]; then
            # Upload arm64
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/gzip" \
              --data-binary @rootfs/rootfs-arm64/rootfs-arm64.tar.gz \
              "${UPLOAD_URL/\{name\}/rootfs-arm64.tar.gz}"
            
            # Upload x86_64
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/gzip" \
              --data-binary @rootfs/rootfs-x86_64/rootfs-x86_64.tar.gz \
              "${UPLOAD_URL/\{name\}/rootfs-x86_64.tar.gz}"
            
            echo "Assets uploaded successfully!"
          else
            echo "Failed to get upload URL"
          fi